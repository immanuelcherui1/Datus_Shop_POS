name: DATUS integrity checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: datus
          POSTGRES_PASSWORD: ci-only-disposable-password
          POSTGRES_DB: datus_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U datus -d datus_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r backend/requirements.lock
      - name: SQLite functional suite
        run: pytest -q
      - name: PostgreSQL suite including concurrent checkout
        env:
          TEST_DATABASE_URL: postgresql+psycopg://datus:ci-only-disposable-password@127.0.0.1:5432/datus_test
        run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
