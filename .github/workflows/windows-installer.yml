name: Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'desktop/**'
      - 'packaging/**'
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/**'
      - '.github/workflows/windows-installer.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: packaging/requirements-build.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/cache@v4
        with:
          path: .packaging-cache/*.zip
          key: datus-windows-tools-pg17.11-nsis3.12-tcl8.6.13
      - run: pip install -r packaging/requirements-build.txt
      - name: Build installer
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.2.0' }
          python packaging/build_installer.py --version $version
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed.' }
      - name: Test frozen setup, checkout, backup and restart
        shell: pwsh
        run: |
          $testPath = Join-Path $env:RUNNER_TEMP 'datus-frozen-smoke'
          $installPath = Join-Path $env:RUNNER_TEMP 'DATUS-installed'
          $setup = Get-ChildItem release\DATUS-Setup-*-x64.exe | Select-Object -First 1
          $process = Start-Process -FilePath $setup.FullName -ArgumentList @('/S', ('/D=' + $installPath)) -WindowStyle Hidden -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw 'Installer failed.' }
          $process = Start-Process -FilePath (Join-Path $installPath 'DATUS.exe') -ArgumentList @('--smoke-test', ('"' + $testPath + '"')) -WindowStyle Hidden -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw 'Frozen application smoke test failed.' }
          $result = Get-Content (Join-Path $testPath 'smoke-result.json') -Raw | ConvertFrom-Json
          if (-not $result.ok) { throw 'Smoke test result missing or unsuccessful.' }
          Copy-Item (Join-Path $testPath 'smoke-result.json') release\smoke-result.json
          $process = Start-Process -FilePath (Join-Path $installPath 'Uninstall.exe') -ArgumentList @('/S', ('_?=' + $installPath)) -WindowStyle Hidden -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw 'Uninstall failed.' }
          if (-not (Test-Path (Join-Path $testPath 'database\PG_VERSION'))) { throw 'Uninstall removed business data.' }
      - uses: actions/upload-artifact@v4
        with:
          name: DATUS-Windows-x64-installer
          path: release/*
          if-no-files-found: error
          retention-days: 90
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DATUS-Windows-x64-installer
          path: release
      - name: Publish versioned installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/* --title "DATUS $RELEASE_TAG" --notes "Windows x64 installer. Includes Python and private PostgreSQL. This build is unsigned; see docs/INSTALLER.md for setup, data preservation, and verification."
